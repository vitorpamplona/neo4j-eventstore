[versions]
kotlin = "2.4.0"
# The published library version.
app = "0.1.0"
mavenPublish = "0.37.0"
# Quartz (Amethyst's Nostr library) from JitPack, PINNED BY COMMIT. Bumps are deliberate:
# the hint providers the graph is derived from, and EventFactory's known-kind set (which
# names relationship types), move with it — docs/appendix-providers.md is re-run and the
# derivation golden tests re-checked on every bump.
# fcd76d2075 — amethyst main @ 2026-09-27; the same pin vespa-eventstore uses, so vespa-relay
# resolves one Quartz for both libraries.
quartz = "fcd76d2075"
coroutines = "1.11.0"
serialization = "1.11.0"
# Apache-2.0. The ONLY Neo4j artifact this project links: the server (GPLv3) is always a
# separate process reached over Bolt — see NoEmbeddedNeo4jTest.
neo4j-driver = "6.3.0"
spotless = "8.8.0"
ktlint = "1.8.0"
testcontainers = "1.21.4"
# The server image the integration tests run against.
neo4j-image = "2026.09-community"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
neo4j-driver = { module = "org.neo4j.driver:neo4j-java-driver", version.ref = "neo4j-driver" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-neo4j = { module = "org.testcontainers:neo4j", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
